[profile.default]
# 每个用例占两个调度名额，并发上限为逻辑 CPU 数的一半，向下取整且不低于 1。
test-threads = "num-cpus"
threads-required = 2
retries = 0
fail-fast = false

[test-groups.mock-write-workspace]
# 这些用例共用 /tmp/pp-test-write，同一时间只能有一个用例访问该目录。
max-threads = 2

[[profile.default.overrides]]
filter = '''
(binary_id(pp-mock-ai) and test(/::integration::mock_runner_(all_suites|write_streams)_/))
or (binary_id(pp::cli_agent) and test(=mock_test::mock_test_normal_agent_session_roles_and_stats_survive_each_scenario))
'''
test-group = "mock-write-workspace"

# L1: 纯单元测试层（纯内存状态机、解析、布局、TestBackend；无子进程/HTTP/PTY）
[profile.unit]
default-filter = 'not binary_id(pp::cli_agent) and not test(/(^|::)integration(::|$)/)'

# L2: Crate 组件集成层（TestServer / REPL / LSP / MCP / Bash / Sandbox）
[profile.integration]
default-filter = 'not binary_id(pp::cli_agent) and test(/(^|::)integration(::|$)/)'

# L3: Headless CLI 二进制端到端层（非 PTY 的 pp::cli_agent）
[profile.e2e-cli]
default-filter = 'binary_id(pp::cli_agent) and not test(/^tui::/)'

# L4: 真实 PTY / TUI 端到端层（cli_agent::tui::）
[profile.e2e-pty]
default-filter = 'binary_id(pp::cli_agent) and test(/^tui::/)'

# 日常快速回归：全部 L1 纯单测 + 核心 L3/L4 冒烟。
[profile.quick]
default-filter = '(not binary_id(pp::cli_agent) and not test(/(^|::)integration(::|$)/)) or (binary_id(pp::cli_agent) and test(/^(command_cases::|non_interactive::|tui::streaming_cases::|tui::plan_mode_cases::|tui::startup_cases::)/))'

# 禁用伪终端的环境仍可运行普通 CLI 和 crate 内测试。
[profile.no_pty]
default-filter = '''
not (binary_id(pp::cli_agent) and (
    test(/^tui::/)
    or test(=lsp::lsp_roundtrip_plan_readonly_denies_mutations_and_server_apply_edit)
))
'''
