[profile.default]
# 每个用例占两个调度名额，并发上限为逻辑 CPU 数的一半，向下取整且不低于 1。
test-threads = "num-cpus"
threads-required = 2
retries = 0
fail-fast = false
default-filter = 'not test(/(^|::)slow_/)'

[test-groups.slow_test]
# 混跑时每个用例仍占两个名额，组内最多同时运行两个慢用例。
max-threads = 4

[[profile.default.overrides]]
filter = 'test(/(^|::)slow_/)'
test-group = "slow_test"

[profile.slow_test]
test-threads = 2
threads-required = 1
default-filter = 'test(/(^|::)slow_/)'

# L1: 纯单元测试层（纯内存状态机、解析、布局、TestBackend；无子进程/HTTP/PTY）
[profile.unit]
default-filter = 'not binary_id(pp::cli_agent) and not test(/::integration(::|$)/) and not test(/(^|::)slow_/)'

# L2: Crate 组件集成层（TestServer / REPL / LSP / MCP / Bash / Sandbox）
[profile.integration]
default-filter = 'not binary_id(pp::cli_agent) and test(/::integration(::|$)/) and not test(/(^|::)slow_/)'

# L3: Headless CLI 二进制端到端层（非 PTY 的 pp::cli_agent）
[profile.e2e-cli]
default-filter = 'binary_id(pp::cli_agent) and not test(/^tui::/) and not test(/(^|::)slow_/)'

# L4: 真实 PTY / TUI 端到端层（cli_agent::tui::）
[profile.e2e-pty]
default-filter = 'binary_id(pp::cli_agent) and test(/^tui::/) and not test(/(^|::)slow_/)'

# 日常快速回归：全部 L1 纯单测 + 核心 L3/L4 冒烟，跳过慢用例。
[profile.quick]
default-filter = '(not binary_id(pp::cli_agent) and not test(/::integration(::|$)/) and not test(/(^|::)slow_/)) or (binary_id(pp::cli_agent) and test(/^(command_cases::|non_interactive::|tui::streaming_cases::|tui::plan_mode_cases::|tui::startup_cases::)/) and not test(/(^|::)slow_/))'

# 禁用伪终端的环境仍可运行普通 CLI、进程内 TUI 和非 PTY 的慢用例。
[profile.no_pty]
default-filter = '''
not (binary_id(pp::cli_agent) and (
    test(/^tui::/)
    or test(=lsp::lsp_roundtrip_plan_readonly_denies_mutations_and_server_apply_edit)
))
'''
