[profile.default]
# Each test claims two scheduler slots; the cap is half the logical CPU count, rounded down to at least 1.
test-threads = "num-cpus"
threads-required = 2
retries = 0
fail-fast = false

[test-groups.mock-write-workspace]
# These tests share /tmp/pp-test-write, so only one test may touch that directory at a time.
max-threads = 2

[[profile.default.overrides]]
filter = '''
(binary_id(pp-mock-ai) and test(/::integration::mock_runner_(all_suites|write_streams)_/))
or (binary_id(pp::cli_agent) and test(=mock_test::mock_test_normal_agent_session_roles_and_stats_survive_each_scenario))
'''
test-group = "mock-write-workspace"

# L1: pure unit layer (in-memory state machines, parsing, layout, TestBackend; no subprocess/HTTP/PTY)
[profile.unit]
default-filter = 'not binary_id(pp::cli_agent) and not test(/(^|::)integration(::|$)/)'

# L2: crate component integration layer (TestServer / REPL / LSP / MCP / Bash / Sandbox)
[profile.integration]
default-filter = 'not binary_id(pp::cli_agent) and test(/(^|::)integration(::|$)/)'

# L3: headless CLI binary end-to-end layer (non-PTY pp::cli_agent)
[profile.e2e-cli]
default-filter = 'binary_id(pp::cli_agent) and not test(/^tui::/)'

# L4: real PTY / TUI end-to-end layer (cli_agent::tui::)
[profile.e2e-pty]
default-filter = 'binary_id(pp::cli_agent) and test(/^tui::/)'

# Daily quick regression: every L1 unit test plus core L3/L4 smoke tests.
[profile.quick]
default-filter = '(not binary_id(pp::cli_agent) and not test(/(^|::)integration(::|$)/)) or (binary_id(pp::cli_agent) and test(/^(command_cases::|non_interactive::|tui::streaming_cases::|tui::plan_mode_cases::|tui::startup_cases::)/))'

# Environments without pseudo-terminals can still run plain CLI and in-crate tests.
[profile.no_pty]
default-filter = '''
not (binary_id(pp::cli_agent) and (
    test(/^tui::/)
    or test(=lsp::lsp_roundtrip_plan_readonly_denies_mutations_and_server_apply_edit)
))
'''
