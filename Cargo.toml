[package]
name = "pp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-openai = { version = "0.42.2", default-features = false, features = ["chat-completion", "responses", "rustls", "byot", "middleware"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
getrandom = "0.4"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonc-parser = { version = "0.34", features = ["serde", "cst"] }
serde_yaml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm", "crossterm_0_29", "unstable-rendered-line-info"] }
crossterm = "0.29.0"
ratatui-textarea = "0.9.3"
unicode-normalization = "0.1"
rustix = { version = "1", features = ["fs", "process"] }
tempfile = "3"

[dev-dependencies]
tiny_http = "0.12"
portable-pty = "0.9.0"
vt100 = "0.16.2"
