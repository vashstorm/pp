[package]
name = "pp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-openai = { version = "0.42.2", default-features = false, features = ["chat-completion", "responses", "rustls", "byot", "middleware"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
getrandom = "0.4"
handlebars = { version = "6.4", default-features = false }
ignore = "0.4"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13", default-features = false }
similar = { version = "2.7", default-features = false, features = ["text"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "dump-load"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"
serde_yaml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "rustls", "form"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry", "std"] }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm", "crossterm_0_29", "unstable-rendered-line-info"] }
crossterm = "0.29.0"
ratatui-textarea = "0.9.3"
unicode-normalization = "0.1"
unicode-segmentation = "1"
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh32"] }
rustix = { version = "1", features = ["fs", "process"] }
tempfile = "3"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tiny_http = "0.12"
base64 = "0.22"
dom_smoothie = "0.18"
html2text = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-pcre2 = "0.1"
regex = "1"
globset = "0.4"
jsonschema = { version = "0.60.2", default-features = false }

[dev-dependencies]
flate2 = "1"
portable-pty = "0.9.0"
vt100 = "0.16.2"

[profile.dev]
# opt-level = 2
debug = "line-tables-only"
#incremental = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
incremental = false
