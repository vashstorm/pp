<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>pp stats</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/stats.css" />
    <link rel="stylesheet" href="/ui.css" />
    <link rel="stylesheet" href="/traces.css" />
    <script src="/activity.js" defer></script>
    <script src="/insights.js" defer></script>
    <script src="/traces.js" defer></script>
    <script src="/context.js" defer></script>
    <script src="/stats.js" defer></script>
  </head>
  <body>
    <div class="shell-ambient"></div>
    <header class="topbar" id="topbar" data-scrolled="false">
      <button
        type="button"
        class="x-btn topbar-menu"
        data-variant="ghost"
        data-icon="true"
        id="menu"
        aria-label="Open navigation"
        title="Open navigation"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <div class="topbar-brand">
        <img
          class="topbar-mark"
          src="/icon.svg"
          alt=""
          width="22"
          height="22"
        />
        <span>pp</span>
        <span class="topbar-slash">/</span>
        <span class="topbar-title">stats</span>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <span class="topbar-hide-narrow">
          <button
            type="button"
            id="live"
            class="live-chip"
            title="Refresh statistics now"
          >
            <span class="x-dot" data-tone="live" data-pulse="true"></span>
            <span>Live</span>
            <span class="live-chip-count"></span>
          </button>
        </span>
        <div
          id="ranges"
          class="x-segmented"
          role="radiogroup"
          aria-label="Time range"
        ></div>
        <button
          type="button"
          id="theme"
          class="x-btn"
          data-variant="ghost"
          data-icon="true"
          aria-label="System theme (click to switch)"
          title="Switch theme"
        ></button>
      </div>
    </header>
    <div class="drawer-scrim" id="menu-scrim" hidden></div>
    <nav class="sidebar" id="sidebar" aria-label="Pages">
      <div id="navigation"></div>
      <div class="sidebar-foot x-micro">
        <span><span class="x-kbd">1</span>–<span class="x-kbd">6</span> range</span>
        <span><span class="x-kbd">G</span> then letter to jump</span>
      </div>
    </nav>
    <main class="shell-panel">
      <div class="shell-content">
        <div id="error" role="status" hidden></div>
        <div id="page"></div>
      </div>
    </main>
    <div id="overlay" hidden>
      <section
        role="dialog"
        aria-modal="true"
        aria-label="Request details"
        tabindex="-1"
        id="drawer"
      ></section>
    </div>
    <div id="context-overlay" hidden>
      <section
        id="context-reader"
        role="dialog"
        aria-modal="true"
        aria-label="Request context"
        tabindex="-1"
      ></section>
    </div>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
