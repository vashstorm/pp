[package]
name = "pp-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pp-core = { path = "../pp-core" }
pp-bash = { path = "../pp-bash" }
pp-config = { path = "../pp-config" }
pp-stats = { path = "../pp-stats" }
pp-llm = { path = "../pp-llm" }
pp-mcp = { path = "../pp-mcp" }
pp-lsp = { path = "../pp-lsp" }
pp-sandbox = { path = "../pp-sandbox" }
pp-workspace = { path = "../pp-workspace" }
pp-tools = { path = "../pp-tools" }
anyhow = { workspace = true }
async-openai = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
chrono = { workspace = true }
getrandom = { workspace = true }
handlebars = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
futures-util = { workspace = true }
pp-test-support = { workspace = true }
pp-workspace = { path = "../pp-workspace", features = ["test-support"] }
serde_yaml = { workspace = true }

[features]
test-support = []
